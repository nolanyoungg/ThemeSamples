<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Try the local Acme AI login demonstration. No authentication service is connected."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Login | acme.ai</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/inter-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/site.css" />
    <script src="assets/site.js" defer></script>
  </head>
  <body class="page-login">
    <svg class="sr-only" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-blocks" viewBox="0 0 24 24">
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          >
            <rect x="14" y="2" width="8" height="8" rx="1" />
            <rect x="2" y="8" width="8" height="8" rx="1" />
            <rect x="2" y="16" width="8" height="6" rx="1" />
            <rect x="10" y="14" width="8" height="8" rx="1" />
          </g>
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path
            d="m6 9 6 6 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="i-data" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <ellipse cx="12" cy="5" rx="8" ry="3" />
            <path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7" />
          </g>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle
            cx="12"
            cy="12"
            r="9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M12 6v6l4 2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
          <path
            d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6l8-4Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="m8 12 3 3 5-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </symbol>
        <symbol id="i-upload" viewBox="0 0 24 24">
          <path
            d="M4 16v5h16v-5M12 17V3m-5 5 5-5 5 5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="m7 4 13 8-13 8V4Z" fill="currentColor" />
        </symbol>
        <symbol id="i-chart" viewBox="0 0 24 24">
          <path
            d="M3 3v18h18M7 16v-5m5 5V7m5 9v-8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </symbol>
        <symbol id="i-message" viewBox="0 0 24 24">
          <path
            d="M21 15a3 3 0 0 1-3 3H8l-5 4V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path d="M7 8h10M7 12h7" stroke="currentColor" stroke-width="1.5" />
        </symbol>
        <symbol id="i-trend" viewBox="0 0 24 24">
          <path
            d="m3 17 6-6 4 4 8-10m-7 0h7v7"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="i-report" viewBox="0 0 24 24">
          <path
            d="M5 2h10l4 4v16H5V2Zm9 0v5h5M8 11h8M8 15h8M8 19h5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </symbol>
        <symbol id="i-quote" viewBox="0 0 24 24">
          <path
            d="M3 4h8v8l-5 8H2l4-8H3V4Zm12 0h8v8l-5 8h-4l4-8h-3V4Z"
            fill="currentColor"
          />
        </symbol>
      </defs>
    </svg>
    <main id="main">
      <section class="auth-page">
        <a class="auth-home" href="index.html">← Back to acme.ai</a>
        <div class="auth-card">
          <h1>Login</h1>
          <p class="auth-subtitle">Welcome back to your example workspace.</p>
          <form data-local-form>
            <div class="auth-grid">
              <button
                type="button"
                class="button secondary"
                data-oauth="Google"
              >
                Login with Google</button
              ><button
                type="button"
                class="button secondary"
                data-oauth="GitHub"
              >
                Login with GitHub
              </button>
            </div>
            <div class="auth-divider">Or continue with</div>
            <label class="field"
              >Email<input
                type="email"
                name="email"
                autocomplete="email"
                placeholder="m@example.com"
                required
            /></label>
            <div class="field">
              <div class="password-label">
                <label for="login-password">Password</label
                ><button type="button" class="text-button" data-reset>
                  Forgot your password?
                </button>
              </div>
              <input
                id="login-password"
                type="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="button">Login</button>
            <p class="form-status" role="status" hidden></p>
          </form>
          <p class="auth-switch">
            Don't have an account? <a href="signup.html">Sign up</a>
          </p>
          <p class="demo-note">
            Local demonstration only. No account is created and no information
            is sent or saved. Use example details.
          </p>
        </div>
      </section>
    </main>
    <dialog
      class="demo-dialog contact-dialog"
      id="contact"
      aria-labelledby="contact-title"
    >
      <div class="dialog-header">
        <div>
          <h2 id="contact-title">How can we help?</h2>
          <p>Local contact demonstration. No message is sent.</p>
        </div>
        <button
          type="button"
          class="dialog-close"
          aria-label="Close contact form"
          data-close
        >
          ×
        </button>
      </div>
      <form data-local-form>
        <label class="field"
          >Email<input
            type="email"
            name="email"
            placeholder="you@example.com"
            required /></label
        ><label class="field"
          >Your question<textarea
            name="message"
            required
            placeholder="Tell us a little about your project…"
          ></textarea></label
        ><button type="submit" class="button">Preview message</button>
        <p class="form-status" role="status" hidden></p>
      </form>
    </dialog>
  </body>
</html>
